<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=3240">
<title>Fixados obliq</title>
<!--
  Os 3 posts fixados do perfil da obliq: UM banner de 3240 x 1350 cortado em três posts de 1080 x 1350.
  A folha inteira é uma página de caderno (a espiral no alto, as pautas a lápis de ponta a ponta), e a
  frase "o caderninho vira sistema." corre pelos três, sublinhada por um traço só. Da esquerda para a
  direita, o caderninho vira sistema:
    - a lista escrita à mão, com o Ponto ainda em tinta;
    - uma seta grande atravessa a emenda até o Ponto, já azul, no notebook;
    - os ícones dos sistemas saem voando da tela dele, atravessam a outra emenda e pousam em fila.

  No grade do perfil o Instagram mostra cada post em 3:4, cortando 34 px de cada lado: o texto fica longe
  das emendas (x 1046 a 1114 e 2126 a 2194); o que atravessa é desenho. Publicar na ordem 3, 2, 1.
  Azul: "sistema.", o Ponto (a mascote, acento da interface) e o ponto do "obliq.", que não conta.
-->
<link rel="stylesheet" href="fontes/fontes.css">
<style>
:root {
  --papel-base: #FDFBF5; --tinta: #1B1814; --tinta-2: #5A564D; --azul: #2946D8;
  --fraunces: 'SOFT' 55, 'opsz' 80;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #D9D4C8; }
body { width: 3240px; }
#folha {
  position: relative; width: 3240px; height: 1350px; overflow: hidden; color: var(--tinta);
  background: url('lib/papel.svg') 0 0 / 1080px 1350px repeat-x, var(--papel-base);
  font-family: 'Hanken Grotesk', sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
}
#folha > * { position: absolute; }
canvas.lapis { left: 0; top: 0; width: 3240px; height: 1350px; pointer-events: none; }

.t { font-family: 'Fraunces', serif; font-weight: 600; font-variation-settings: var(--fraunces); letter-spacing: -0.015em; line-height: 1; font-size: 176px; white-space: nowrap; }
.t i { font-style: italic; color: var(--azul); }
.corpo { font-size: 34px; line-height: 48px; color: var(--tinta-2); }
.corpo b { font-weight: 500; color: var(--tinta); }
.nota { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-variation-settings: 'SOFT' 55, 'opsz' 18; font-size: 34px; color: var(--tinta-2); transform: rotate(-2.4deg); transform-origin: left top; white-space: nowrap; }

/* o Ponto (ponto.js, as poses do app) */
.ponto-fixo { line-height: 0; }
.ponto-fixo svg { display: block; shape-rendering: crispEdges; }
.pt-b { fill: var(--azul); } .pt-s { fill: #1E33A8; } .pt-k { fill: var(--tinta); } .pt-g { fill: var(--tinta-2); } .pt-l { fill: #93A8FF; }
.ponto-tinta .pt-b, .ponto-tinta .pt-s { fill: var(--tinta); }
.ponto-tinta .pt-l { fill: var(--tinta-2); }
.ponto-papel .pt-b, .ponto-papel .pt-s, .ponto-papel .pt-k, .ponto-papel .pt-g, .ponto-papel .pt-l { fill: #FAF7F0; }

/* os ícones da família (guideline §2b): tinta cheia do produto, raio de 22,4%, o qualificador em
   Fraunces itálica ocupando ~74% da caixa. O tamanho vem de --s, então o mesmo ícone voa pequeno e
   pousa grande. O do Prospect é o próprio Ponto, em papel sobre o azul da casa. */
.ic { --s: 176px; width: var(--s); height: var(--s); border-radius: 22.4%; display: grid; place-items: center; box-shadow: 0 2px 4px rgba(27,24,20,.08), 0 22px 40px -22px rgba(27,24,20,.45); }
.ic span { font-family: 'Fraunces', serif; font-style: italic; font-weight: 600; font-variation-settings: 'SOFT' 70, 'opsz' 80; letter-spacing: -0.02em; line-height: 1; font-size: calc(var(--s) * .636); transform: translateY(calc(var(--s) * -.034)); }
.ic.x span { transform: translateY(calc(var(--s) * -.08)); }
.ic.epi span { font-size: calc(var(--s) * .477); transform: translateY(calc(var(--s) * -.09)); }
.ic.epi::after { content: ''; position: absolute; left: 32%; right: 32%; bottom: 20.5%; height: 2.8%; border-radius: 3px; background: #FAF7F0; }
.ic.adega { box-shadow: inset 0 0 0 calc(var(--s) * .068) #1B1814, 0 22px 40px -22px rgba(27,24,20,.45); }
.ic.adega span { font-size: calc(var(--s) * .52); }
.rotulo { font: 500 24px/1 'Hanken Grotesk'; color: var(--tinta); text-align: center; }

/* posições */
#t1 { left: 80px; top: 96px; }
#t2 { left: 1190px; top: 96px; }
#t3 { left: 2250px; top: 96px; }
#ponto1 { left: 470px; top: 1010px; }
#ponto2 { left: 1352px; top: 818px; }
#nota { left: 1190px; top: 1226px; }
#marca { left: 2250px; top: 990px; font-family: 'Fraunces', serif; font-weight: 700; font-variation-settings: var(--fraunces); letter-spacing: -0.015em; font-size: 150px; line-height: 1; }
#marca i { font-style: normal; color: var(--azul); }
#convite { left: 2256px; top: 1196px; width: 900px; }
#oito { left: 2256px; top: 890px; }
</style>
</head>
<body>
<div id="folha">
  <!-- a página de caderno: espiral, pautas, margem (atrás de tudo) -->
  <canvas class="lapis" id="caderno"></canvas>

  <!-- a frase, de ponta a ponta -->
  <p class="t" id="t1">o caderninho</p>
  <p class="t" id="t2">vira</p>
  <p class="t" id="t3"><i>sistema.</i></p>

  <!-- o Ponto em tinta, junto da lista; o Ponto azul no notebook -->
  <span class="ponto-fixo ponto-tinta" id="ponto1" data-pose="pensando" data-q="7" data-escala="10"></span>
  <span class="ponto-fixo" id="ponto2" data-pose="notebook" data-q="18" data-escala="22"></span>
  <p class="nota" id="nota">duas mentes: uma desenha, a outra programa.</p>

  <!-- os ícones: o JS monta cada um da lista ICONES (voando ou pousado) -->

  <p class="corpo" id="oito">oito sistemas próprios, <b>seis no ar.</b></p>
  <p id="marca">obliq<i>.</i></p>
  <p class="corpo" id="convite">a prévia do seu sistema sai <b>antes de você pagar.</b></p>

  <!-- o lápis por cima: a lista à mão, a seta, o rastro dos ícones, o sublinhado -->
  <canvas class="lapis" id="lapis"></canvas>
</div>

<script src="lib/ponto.js"></script>
<script src="lib/lapis.js"></script>
<script>
// os ícones: os quatro primeiros saem voando do notebook e atravessam a emenda; os outros pousaram
const ICONES = [
  { g: '3d',  bg: '#E3A008', fg: '#1B1814', x: 1800, y: 660, s: 92,  r: -12, nome: 'relevo' },
  { g: 've',  bg: '#4F7A2E', fg: '#FAF7F0', x: 1990, y: 590, s: 112, r: 9,   nome: 'validade', cls: 'x' },
  { g: 'nf',  bg: '#0F6E72', fg: '#FAF7F0', x: 2310, y: 478, s: 128, r: -7,  nome: 'confere' },
  { g: 'vi',  bg: '#FF8FE9', fg: '#1B1814', x: 2560, y: 446, s: 140, r: 6,   nome: 'vitrine' },
  { g: 'epi', bg: '#7A2463', fg: '#FAF7F0', x: 2330, y: 710, s: 170, r: 0,   nome: 'entrega', cls: 'epi' },
  { g: 'co',  bg: '#1B1814', fg: '#FAF7F0', x: 2540, y: 710, s: 170, r: 0,   nome: 'controle', cls: 'x' },
  { g: 'ad',  bg: '#FAF7F0', fg: '#1B1814', x: 2750, y: 710, s: 170, r: 0,   nome: 'adega', cls: 'adega' },
  { g: '',    bg: '#2946D8', fg: '#FAF7F0', x: 2960, y: 710, s: 170, r: 0,   nome: 'prospect', ponto: true },
];
const pagina = document.getElementById('folha');
const antes = document.getElementById('oito');
for (const i of ICONES) {
  const d = document.createElement('div');
  d.className = 'ic ' + (i.cls || '');
  d.style.cssText = `--s:${i.s}px;left:${i.x - i.s / 2}px;top:${i.y - i.s / 2}px;background:${i.bg};color:${i.fg};transform:rotate(${i.r}deg)`;
  d.innerHTML = i.ponto ? `<span class="ponto-fixo ponto-papel" data-pose="parado" data-q="0" data-escala="${(i.s * 7.8 / 176).toFixed(2)}" style="transform:translate(${i.s * 0.02}px,0)"></span>` : `<span>${i.g}</span>`;
  pagina.insertBefore(d, antes);
  if (!i.r) {
    const n = document.createElement('p'); n.className = 'rotulo'; n.textContent = i.nome;
    n.style.cssText = `left:${i.x - 100}px;width:200px;top:${i.y + i.s / 2 + 16}px`;
    pagina.insertBefore(n, antes);
  }
}

document.querySelectorAll('.ponto-fixo').forEach((el) => {
  const q = window.Ponto.quadrosDe(el.dataset.pose)[Number(el.dataset.q) || 0];
  const e = Number(el.dataset.escala) || 2;
  el.innerHTML = `<svg viewBox="0 0 24 16" width="${24 * e}" height="${16 * e}" aria-hidden="true">${q}</svg>`;
});

const ESC = 2;
function tela(id) { const c = document.getElementById(id); c.width = 3240 * ESC; c.height = 1350 * ESC; const ctx = c.getContext('2d'); ctx.scale(ESC, ESC); return ctx; }

function caderno() {
  const ctx = tela('caderno'), r = stream(SEED * 29 + 1);
  // a espiral no alto, de ponta a ponta
  for (let x = 40; x < 3220; x += 62) {
    wob(ctx, circ(x, 34, 12, 16, 1.05, 0.4), { w: 1.8, color: TINTA, rng: r, alpha: 0.7, amp: 0.3, noDust: true });
    wob(ctx, [[x, 46], [x + 2, 58]], { w: 1.4, color: TINTA2, rng: r, alpha: 0.5, amp: 0.2, noDust: true });
  }
  // as pautas: atravessam os três posts
  for (let y = 380; y <= 1320; y += 70) wob(ctx, [[0, y], [3240, y + Math.sin(y) * 2]], { w: 1, color: TINTA2, rng: r, alpha: 0.28, amp: 0.8, noDust: true });
  // a margem do caderno
  wob(ctx, [[150, 330], [152, 1350]], { w: 1.2, color: TINTA2, rng: r, alpha: 0.4, amp: 0.5, noDust: true });
}

function tracos() {
  const ctx = tela('lapis'), r = stream(SEED * 29 + 2);
  // o sublinhado da frase, um traço só pelos três posts
  const sub = []; for (let x = 84; x <= 3110; x += 40) sub.push([x, 300 + Math.sin(x * 0.004) * 7 + Math.sin(x * 0.013) * 3]);
  wob(ctx, sub, { w: 3.2, color: TINTA, rng: r, alpha: 0.85, amp: 1.1 });

  // a lista à mão, nas pautas do post 1
  const LISTA = [['leite ........ 12', 520], ['arroz ........ 8', 590], ['vinho tinto ... 6', 660], ['luva entregue', 730], ['conferir a nota', 800], ['cerveja ...... 24', 870], ['fechou o caixa', 940]];
  for (const [txt, y] of LISTA) escreve(ctx, txt, 190, y - 6, 50, r);
  wob(ctx, [[186, 850], [600, 842]], { w: 2.4, color: TINTA, rng: r, alpha: 0.85, amp: 0.8 });
  wob(ctx, elipse(370, 780, 220, 44), { w: 2, color: TINTA, rng: r, alpha: 0.8, amp: 1, taper: 'out' });
  wob(ctx, [[652, 704], [674, 726], [712, 680]], { w: 2.6, color: TINTA, rng: r, alpha: 0.9, amp: 0.4 });

  // a seta grande: da lista, atravessando a emenda, até o notebook
  seta(ctx, [[660, 610], [860, 520], [1080, 540], [1260, 660], [1380, 830]], { w: 3.4, color: TINTA, rng: stream(SEED * 29 + 3), cabeca: 22 });

  // o rastro dos ícones saindo do notebook, tracejado, atravessando a outra emenda
  const rastro = [[1640, 860], [1720, 740], ...ICONES.slice(0, 4).map((i) => [i.x, i.y]), [2700, 420]];
  wob(ctx, chaikin(rastro, false, 3), { w: 1.6, color: TINTA2, rng: stream(SEED * 29 + 4), alpha: 0.6, amp: 0.8, gap: 0.5, noDust: true });
  // riscos de velocidade atrás de cada ícone voando
  for (const i of ICONES.slice(0, 4)) for (const k of [-1, 0, 1]) {
    const bx = i.x - i.s * 0.62, by = i.y + i.s * 0.28 + k * i.s * 0.16;
    wob(ctx, [[bx, by], [bx - i.s * 0.45, by + i.s * 0.2]], { w: 1.5, color: TINTA2, rng: r, alpha: 0.55, amp: 0.3, noDust: true });
  }
}
function elipse(cx, cy, rx, ry) { const p = []; for (let i = 0; i <= 40; i++) { const a = -2.2 + 6.9 * i / 40; p.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); } return p; }
// a letra à mão sem os vãos: cada glifo encosta no anterior pela tinta, não pela caixa
function escreve(ctx, txt, x, y, sz, r) {
  let cx = x;
  for (const chr of txt.normalize('NFD').replace(/[̀-ͯ]/g, '')) {
    if (chr === ' ') { cx += sz * 0.36; continue; }
    const g = window.__A[chr]; if (!g) { cx += sz * 0.4; continue; }
    let x0 = 9, x1 = -9; for (const tr of g) for (const q of tr) { x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); }
    atext(ctx, chr, cx - x0 * sz, y, sz, { rng: r, color: '#2B2620' });
    cx += (x1 - x0 + 0.17) * sz;
  }
}

document.fonts.ready.then(() => { caderno(); tracos(); document.body.dataset.pronto = '1'; });
</script>
</body>
</html>
