<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=3240">
<title>Fixados obliq</title>
<!--
  Os 3 posts fixados do perfil da obliq: UM banner de 3240 x 1350 cortado em três posts de 1080 x 1350.
  O Ponto gigante, em tinta, em pé no meio do banner, com o corpo centrado na segunda emenda: cada um
  dos posts 2 e 3 fica com um olho dele. Com a mão esquerda ele segura o caderninho; da direita, os
  ícones dos oito sistemas caem em cascata. A frase corre pelo alto: "o caderninho | vira | sistema."

  O Ponto é a pose "parado" do ponto.js (a mesma do app), a 90 px por pixel. Nenhum texto encosta nas
  emendas (x 1046 a 1114 e 2126 a 2194): o que atravessa é o Ponto e o caderninho. Publicar 3, 2, 1.
  Azul: "sistema.", o ícone do Prospect e o ponto do "obliq.", que não conta. O Ponto grande é tinta.
-->
<link rel="stylesheet" href="fontes/fontes.css">
<style>
:root {
  --papel-base: #FDFBF5; --tinta: #1B1814; --tinta-2: #5A564D; --azul: #2946D8;
  --fraunces: 'SOFT' 55, 'opsz' 80;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #D9D4C8; }
body { width: 3240px; }
#folha {
  position: relative; width: 3240px; height: 1350px; overflow: hidden; color: var(--tinta);
  background: url('lib/papel.svg') 0 0 / 1080px 1350px repeat-x, var(--papel-base);
  font-family: 'Hanken Grotesk', sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
}
#folha > * { position: absolute; }
canvas.lapis { left: 0; top: 0; width: 3240px; height: 1350px; pointer-events: none; }

.t { font-family: 'Fraunces', serif; font-weight: 600; font-variation-settings: var(--fraunces); letter-spacing: -0.015em; line-height: 1; white-space: nowrap; }
.t i { font-style: italic; color: var(--azul); }
.grande { font-size: 176px; }
.corpo { font-size: 34px; line-height: 48px; color: var(--tinta-2); }
.corpo b { font-weight: 500; color: var(--tinta); }
.nota { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-variation-settings: 'SOFT' 55, 'opsz' 18; font-size: 34px; color: var(--tinta-2); transform: rotate(-2.4deg); transform-origin: left top; white-space: nowrap; }

/* o Ponto (ponto.js, as poses do app) */
.ponto-fixo { line-height: 0; }
.ponto-fixo svg { display: block; shape-rendering: crispEdges; }
.pt-b { fill: var(--azul); } .pt-s { fill: #1E33A8; } .pt-k { fill: var(--tinta); } .pt-g { fill: var(--tinta-2); } .pt-l { fill: #93A8FF; }
.ponto-tinta .pt-b, .ponto-tinta .pt-s { fill: var(--tinta); }
.ponto-tinta .pt-l { fill: var(--tinta-2); }
.ponto-papel .pt-b, .ponto-papel .pt-s, .ponto-papel .pt-k, .ponto-papel .pt-g, .ponto-papel .pt-l { fill: #FAF7F0; }

/* os ícones da família (guideline §2b); o tamanho vem de --s */
.ic { --s: 176px; width: var(--s); height: var(--s); border-radius: 22.4%; display: grid; place-items: center; box-shadow: 0 2px 4px rgba(27,24,20,.08), 0 22px 40px -22px rgba(27,24,20,.45); }
.ic span { font-family: 'Fraunces', serif; font-style: italic; font-weight: 600; font-variation-settings: 'SOFT' 70, 'opsz' 80; letter-spacing: -0.02em; line-height: 1; font-size: calc(var(--s) * .636); transform: translateY(calc(var(--s) * -.034)); }
.ic.x span { transform: translateY(calc(var(--s) * -.08)); }
.ic.epi span { font-size: calc(var(--s) * .477); transform: translateY(calc(var(--s) * -.09)); }
.ic.epi::after { content: ''; position: absolute; left: 32%; right: 32%; bottom: 20.5%; height: 2.8%; border-radius: 3px; background: #FAF7F0; }
.ic.adega { box-shadow: inset 0 0 0 calc(var(--s) * .068) #1B1814, 0 22px 40px -22px rgba(27,24,20,.45); }
.ic.adega span { font-size: calc(var(--s) * .52); }

/* posições */
#t1 { left: 80px; top: 92px; }
#t2 { left: 1170px; top: 92px; }
#t3 { left: 2244px; top: 92px; }
#pontao { left: 1170px; top: 0; }
#frase { left: 86px; top: 350px; font-size: 64px; line-height: 1.04; }
#diz { left: 88px; top: 600px; width: 640px; }
#nota { left: 88px; top: 820px; }
#marca { left: 80px; top: 1010px; font-family: 'Fraunces', serif; font-weight: 700; font-variation-settings: var(--fraunces); letter-spacing: -0.015em; font-size: 140px; line-height: 1; }
#marca i { font-style: normal; color: var(--azul); }
#convite { left: 88px; top: 1206px; width: 880px; }
</style>
</head>
<body>
<div id="folha">
  <!-- o caderninho, a lápis, embaixo da mão do Ponto -->
  <canvas class="lapis" id="caderno"></canvas>

  <!-- a frase pelo alto -->
  <p class="t grande" id="t1">o caderninho</p>
  <p class="t grande" id="t2">vira</p>
  <p class="t grande" id="t3"><i>sistema.</i></p>

  <!-- o Ponto gigante: a pose parada do app, 24 x 16 pixels a 90 px cada -->
  <span class="ponto-fixo ponto-tinta" id="pontao" data-pose="parado" data-q="0" data-escala="90"></span>

  <!-- post 1: o que a casa faz, e o convite -->
  <p class="t" id="frase">sistema próprio,<br>no preço de<br>negócio pequeno.</p>
  <p class="corpo" id="diz">sob medida pro que o seu negócio já faz. oito sistemas próprios, <b>seis no ar.</b></p>
  <p class="nota" id="nota">duas mentes: uma desenha, a outra programa.</p>
  <p id="marca">obliq<i>.</i></p>
  <p class="corpo" id="convite">a prévia do seu sistema sai <b>antes de você pagar.</b></p>

  <!-- os ícones: o JS monta cada um da lista ICONES -->
  <canvas class="lapis" id="tracos"></canvas>
</div>

<script src="lib/ponto.js"></script>
<script src="lib/lapis.js"></script>
<script>
// a cascata que sai da mão direita do Ponto (o braço dele está em x 2700 a 2880, y 810 a 900)
const ICONES = [
  { g: '3d',  bg: '#E3A008', fg: '#1B1814', x: 3070, y: 430,  r: 8 },
  { g: 've',  bg: '#4F7A2E', fg: '#FAF7F0', x: 2850, y: 500,  r: -6, cls: 'x' },
  { g: 'nf',  bg: '#0F6E72', fg: '#FAF7F0', x: 3070, y: 630,  r: 5 },
  { g: 'vi',  bg: '#FF8FE9', fg: '#1B1814', x: 2850, y: 680,  r: -9 },
  { g: 'epi', bg: '#7A2463', fg: '#FAF7F0', x: 3070, y: 840,  r: 7, cls: 'epi' },
  { g: 'co',  bg: '#1B1814', fg: '#FAF7F0', x: 2850, y: 1010, r: -4, cls: 'x' },
  { g: 'ad',  bg: '#FAF7F0', fg: '#1B1814', x: 3070, y: 1090, r: 6, cls: 'adega' },
  { g: '',    bg: '#2946D8', fg: '#FAF7F0', x: 2850, y: 1240, r: -3, ponto: true },
];
const S = 140;
const pagina = document.getElementById('folha'), antes = document.getElementById('tracos');
for (const i of ICONES) {
  const d = document.createElement('div');
  d.className = 'ic ' + (i.cls || '');
  d.style.cssText = `--s:${S}px;left:${i.x - S / 2}px;top:${i.y - S / 2}px;background:${i.bg};color:${i.fg};transform:rotate(${i.r}deg)`;
  d.innerHTML = i.ponto ? `<span class="ponto-fixo ponto-papel" data-pose="parado" data-q="0" data-escala="${(S * 7.8 / 176).toFixed(2)}" style="transform:translate(${S * 0.02}px,0)"></span>` : `<span>${i.g}</span>`;
  pagina.insertBefore(d, antes);
}

document.querySelectorAll('.ponto-fixo').forEach((el) => {
  const q = window.Ponto.quadrosDe(el.dataset.pose)[Number(el.dataset.q) || 0];
  const e = Number(el.dataset.escala) || 2;
  el.innerHTML = `<svg viewBox="0 0 24 16" width="${24 * e}" height="${16 * e}" aria-hidden="true">${q}</svg>`;
});

const ESC = 2;
function tela(id) { const c = document.getElementById(id); c.width = 3240 * ESC; c.height = 1350 * ESC; const ctx = c.getContext('2d'); ctx.scale(ESC, ESC); return ctx; }

// o caderninho: a página atravessa a primeira emenda e entra embaixo da mão esquerda do Ponto
function caderno() {
  const ctx = tela('caderno'), r = stream(SEED * 31 + 1);
  ctx.save(); ctx.translate(960, 540); ctx.rotate(-0.06);
  const LW = 560, LH = 690;
  fillPoly(ctx, rect(0, 0, LW, LH), '#FFFFFF', 0.95);
  wob(ctx, rect(0, 0, LW, LH), { w: 2.2, color: TINTA, rng: r, alpha: 0.9, amp: 0.8, noDust: true });
  for (let k = 0; k < 8; k++) wob(ctx, circ(44 + k * 68, 0, 12, 16, 1.05, 0.4), { w: 2, color: TINTA, rng: r, alpha: 0.85, amp: 0.3, noDust: true });
  for (let y = 100; y < LH - 20; y += 72) wob(ctx, [[18, y], [LW - 18, y]], { w: 1, color: TINTA2, rng: r, alpha: 0.35, amp: 0.5, noDust: true });
  wob(ctx, [[150, 30], [150, LH - 12]], { w: 1.1, color: TINTA2, rng: r, alpha: 0.45, amp: 0.4, noDust: true });
  // a lista começa depois da emenda (x > 1114 na folha), para nenhuma letra cair no corte do grade
  const LISTA = [['leite ..... 12', 92], ['arroz ..... 8', 164], ['vinho ..... 6', 236], ['luva ok', 308], ['nota?', 380], ['caixa ..... fechou', 452]];
  for (const [txt, y] of LISTA) escreve(ctx, txt, 172, y, 46, r);
  wob(ctx, elipse(222, 364, 70, 32), { w: 2, color: TINTA, rng: r, alpha: 0.85, amp: 0.8, taper: 'out' });
  wob(ctx, [[330, 300], [348, 318], [380, 276]], { w: 2.6, color: TINTA, rng: r, alpha: 0.9, amp: 0.4 });
  ctx.restore();
}

function tracos() {
  const ctx = tela('tracos'), r = stream(SEED * 31 + 2);
  // o sublinhado da frase, um traço só pelos três posts, por cima da cabeça do Ponto
  const sub = []; for (let x = 84; x <= 3150; x += 40) sub.push([x, 296 + Math.sin(x * 0.004) * 7 + Math.sin(x * 0.013) * 3]);
  wob(ctx, sub, { w: 3.2, color: TINTA, rng: r, alpha: 0.85, amp: 1.1 });
  // riscos de movimento dos ícones saindo da mão direita
  for (const [x, y, a] of [[2905, 790, -0.9], [2915, 830, -0.2], [2905, 880, 0.6]]) wob(ctx, [[x, y], [x + Math.cos(a) * 50, y + Math.sin(a) * 50]], { w: 2.2, color: TINTA, rng: r, alpha: 0.8, amp: 0.3 });
}
function elipse(cx, cy, rx, ry) { const p = []; for (let i = 0; i <= 40; i++) { const a = -2.2 + 6.9 * i / 40; p.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); } return p; }
// a letra à mão sem os vãos: cada glifo encosta no anterior pela tinta, não pela caixa
function escreve(ctx, txt, x, y, sz, r) {
  let cx = x;
  for (const chr of txt.normalize('NFD').replace(/[̀-ͯ]/g, '')) {
    if (chr === ' ') { cx += sz * 0.36; continue; }
    const g = window.__A[chr]; if (!g) { cx += sz * 0.4; continue; }
    let x0 = 9, x1 = -9; for (const tr of g) for (const q of tr) { x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); }
    atext(ctx, chr, cx - x0 * sz, y, sz, { rng: r, color: '#2B2620' });
    cx += (x1 - x0 + 0.17) * sz;
  }
}

document.fonts.ready.then(() => { caderno(); tracos(); document.body.dataset.pronto = '1'; });
</script>
</body>
</html>
