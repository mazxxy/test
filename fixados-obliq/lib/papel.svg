<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- O papel da casa: por cima do fundo #FDFBF5, uma nuvem larga e uma fibra fina, em tinta de
       papel (marrom quente) com alfa baixo. A média volta a #FAF7F0. Sem grão de filtro. -->
  <filter id="nuvem" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0045" numOctaves="3" seed="11"/>
    <feColorMatrix values="0 0 0 0 0.46  0 0 0 0 0.38  0 0 0 0 0.24  0.07 0 0 0 -0.012"/>
  </filter>
  <filter id="fibra" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55 0.22" numOctaves="2" seed="4"/>
    <feColorMatrix values="0 0 0 0 0.40  0 0 0 0 0.33  0 0 0 0 0.22  0.05 0 0 0 -0.012"/>
  </filter>
  <rect width="1080" height="1350" filter="url(#nuvem)"/>
  <rect width="1080" height="1350" filter="url(#fibra)"/>
</svg>
